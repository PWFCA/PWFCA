function openTab(name){
  var contents = document.getElementsByClassName("tab-content");
  for(var i=0;i<contents.length;i++) contents[i].classList.remove("active");
  var btns = document.getElementsByClassName("tab-btn");
  for(var i=0;i<btns.length;i++) btns[i].classList.remove("active");
  document.getElementById(name).classList.add("active");
  event.currentTarget.classList.add("active");
  window.scrollTo(0,0);
}
function toggleAI(){
  let box = document.getElementById('aiBox');
  box.style.display = box.style.display === 'block'? 'none' : 'block';
}
function sendAI(){
  let input = document.getElementById('aiInput');
  let text = input.value.trim();
  if(!text) return;
  addMsg(text, 'userMsg');
  input.value = '';
  setTimeout(()=>{ let reply = getAIReply(text); addMsg(reply, 'botMsg'); }, 600);
}
function addMsg(t, cls){
  let m = document.getElementById('aiMessages');
  let d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerText = t;
  m.appendChild(d);
  m.scrollTop = m.scrollHeight;
}
function getAIReply(q){
  q = q.toLowerCase();
  if(q.includes('sign')) return "✅ Sign In tab available! Tap SIGN IN tab above or use: https://forms.gle/WG9Mk4i4K3EJfXwB7 - Optional to get updates on WhatsApp.";

}
